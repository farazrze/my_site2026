{% load static %}
{% load blog_tag %}

<div class="single-sidebar-widget post-category-widget">
              <h4 class="category-title">Post Catgories</h4>
              <ul class="cat-list">
                <li>
                  {% for name,count in categoris.items %}
                  <a href="{% url 'blog:category_blog' cat_name=name %}" class="d-flex justify-content-between">
                    <p>{{ name }}</p>
                    <p>{{ count }}</p>
                  </a>
                  {% endfor %}
                </li>
                
            </div>
